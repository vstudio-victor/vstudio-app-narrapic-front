<div
  class="relative backdrop-blur-md bg-white/35 rounded-xl p-6 shadow-xl border border-white/20 h-full"
>
  <div
    class="absolute inset-0 bg-cover bg-center blur-xl -z-10"
    [style.background-image]="uploadedImage ? 'url(' + uploadedImage + ')' : 'none'"
  ></div>
  <!-- Upload Box -->
  <div class="mb-6">
    <!-- Hidden File Input -->
    <input
      #fileInput
      type="file"
      accept="image/*"
      (change)="onImageUpload($event)"
      class="hidden"
    />

    <!-- Upload Area (shown when no image) -->
    @if (!imageSource()) {
      <div
        (click)="fileInput.click()"
        class="flex flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-200 bg-slate-50/60 px-6 py-12 text-center transition hover:border-violet-300 cursor-pointer group"
      >
        <span
          class="mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-violet-100 text-violet-600"
        >
          <svg
            class="h-7 w-7"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="M17 8l-5-5-5 5" />
            <path d="M12 3v12" />
          </svg>
        </span>
        <p class="text-sm font-semibold text-slate-700">Drag &amp; drop your image here</p>
        <p class="mt-1 text-xs text-slate-400">or click to browse</p>
        <p class="mt-4 text-xs text-slate-300">JPG, PNG, WEBP up to 20MB</p>
      </div>
    }
    @else {
      <div class="relative rounded-lg overflow-hidden group p-5 backdrop-blur-sm">
        <img
          [src]="imageSource()"
          alt="Uploaded image"
          class="w-auto h-35 object-contain rounded-lg"
        />

        <!-- Remove/Change Image Overlay -->
        <div
          class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-4"
        >
          <button
            (click)="removeImage()"
            class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors flex items-center gap-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              ></path>
            </svg>
            Remove
          </button>

          <button
            (click)="fileInput.click()"
            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors flex items-center gap-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
              ></path>
            </svg>
            Change
          </button>
        </div>
      </div>
    }
  </div>
</div>
