
<div class="relative backdrop-blur-md bg-white/35 rounded-xl p-6 shadow-xl border border-white/20 h-full">
  <div class="absolute inset-0 bg-cover bg-center blur-xl -z-10"
    [style.background-image]="uploadedImage() ? 'url(' + uploadedImage() + ')' : 'none'">
  </div>
  <!-- Upload Box -->
  <div class="mb-6">
    <!-- Hidden File Input -->
    <input #fileInput type="file" accept="image/*" (change)="onImageUpload($event)" class="hidden">

    <!-- Upload Area (shown when no image) -->
    @if (!uploadedImage()) {
    <div (click)="fileInput.click()"
      class="border-2 border-dashed border-gray-400 rounded-lg p-8 h-64 flex items-center justify-center hover:border-orange-400 transition-colors cursor-pointer group">

      <div class="flex flex-col items-center justify-center text-center pointer-events-none">
        <!-- Upload Icon -->
        <svg class="w-16 h-16 text-white group-hover:text-orange-400 transition-colors mb-4" fill="none"
          stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
          </path>
        </svg>

        <p class="text-white font-medium mb-1">Click to upload or drag and drop</p>
        <p class="text-white text-sm">PNG, JPG up to 10MB</p>
      </div>
    </div>
    }

    <!-- Image Preview (shown when image uploaded) -->
    @if (uploadedImage()) {
    <div class="relative rounded-lg overflow-hidden group p-5 backdrop-blur-sm">
      <img [src]="uploadedImage()" alt="Uploaded image" class="w-full h-full object-contain rounded-lg">

      <!-- Remove/Change Image Overlay -->
      <div
        class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-4">
        <button (click)="removeImage()"
          class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
            </path>
          </svg>
          Remove
        </button>

        <button (click)="fileInput.click()"
          class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
          </svg>
          Change
        </button>
      </div>
    </div>
    }
  </div>
</div>
