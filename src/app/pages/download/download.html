<div class="min-h-screen bg-[#f7f7fb]">
  <!-- Top bar -->
  <header class="border-b border-slate-100 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
       <a routerLink="/"><div class="flex items-center gap-2">
        <img class="h-20 w-auto" src="../../assets/images/logo1.png" alt="" />
      </div></a>
      <a routerLink="/results" class="text-sm font-medium text-slate-400 hover:text-slate-600">Back to results</a>
    </div>
  </header>

  <div class="mx-auto flex max-w-2xl flex-col items-center px-6 py-14">
    <div class="w-full rounded-2xl border border-slate-100 bg-white p-8 text-center shadow-sm">
      <div class="relative mx-auto mb-6 flex h-28 w-28 items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-violet-100 to-fuchsia-100"></div>
        <span class="relative text-5xl">🎉</span>
      </div>

      <h1 class="text-2xl font-extrabold text-slate-900">Your project is ready!</h1>
      <p class="mt-2 text-sm text-slate-400">Your files have been prepared and are ready to download.</p>

      <!-- Included list -->
      <div class="mt-8 rounded-xl border border-slate-100 bg-slate-50/60 p-5 text-left">
        <p class="mb-3 text-sm font-semibold text-slate-700">Included in your download:</p>
        <ul class="space-y-2.5">
          @for (item of included; track item) {
            <li class="flex items-center gap-2 text-sm text-slate-600">
              <span class="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-100 text-emerald-600">
                <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
              </span>
              {{ item }}
            </li>
          }
        </ul>
      </div>

      <button
        (click)="downloadEverything()"
        [disabled]="isDownloading()"
        class="mt-8 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-orange-500 via-pink-500 to-violet-600 px-6 py-3.5 text-base font-bold text-white shadow-lg shadow-orange-200/60 transition-transform hover:scale-[1.01] disabled:cursor-not-allowed disabled:opacity-80"
      >
        @if (isDownloading()) {
          <svg class="h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
          </svg>
          Preparing your ZIP...
        } @else {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" /></svg>
          Download Everything (ZIP)
        }
      </button>

      <a
        routerLink="/create"
        class="mt-3 inline-block w-full rounded-xl border border-slate-200 px-6 py-3 text-sm font-semibold text-slate-600 transition hover:bg-slate-50"
      >
        Generate Another Project
      </a>
    </div>
  </div>
</div>
