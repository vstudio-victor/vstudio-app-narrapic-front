    <!-- User -->
    <div class="relative border-t border-slate-100">
      <button
        type="button"
        (click)="toggleUserMenu($event)"
        class="flex w-full items-center gap-3 px-4 py-4 text-left transition-colors hover:bg-slate-50"
        [attr.aria-expanded]="isUserMenuOpen()"
      >
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-500 text-sm font-semibold text-white">
          V
        </span>
        <span class="flex-1">
          <span class="block text-sm font-semibold text-slate-800">Victor V.</span>
          <span class="block text-xs text-slate-400">Pro Plan</span>
        </span>
        <svg
          class="h-4 w-4 text-slate-400 transition-transform duration-200"
          [class.rotate-180]="isUserMenuOpen()"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        ><path d="m6 9 6 6 6-6" /></svg>
      </button>

      <!-- Dropdown Menu -->
      @if (isUserMenuOpen()) {
        <div
          class="animate-fade-in absolute bottom-full left-3 right-3 mb-2 overflow-hidden rounded-xl border border-slate-100 bg-white shadow-xl shadow-slate-200/60 z-50"
        >
          <div class="border-b border-slate-100 px-4 py-3">
            <p class="text-sm font-semibold text-slate-800">Victor V.</p>
            <p class="truncate text-xs text-slate-400">vvictor.fotograf&#64;gmail.com</p>
          </div>

          <div class="py-1.5">
            @for (item of userMenuItems; track item.label) {
              <a
                [routerLink]="item.link"
                class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900"
              >
                <svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  @switch (item.icon) {
                    @case ('user') { <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /> }
                    @case ('settings') { <circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" /> }
                    @case ('card') { <rect x="2" y="5" width="20" height="14" rx="2" /><path d="M2 10h20" /> }
                    @case ('help') { <circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /> }
                  }
                </svg>
                {{ item.label }}
              </a>
            }
          </div>

          <div class="border-t border-slate-100 py-1.5">
            <button
            (click)="signOut()"
              type="button"
              class="flex w-full items-center gap-3 px-4 py-2.5 text-sm font-medium text-rose-600 transition-colors hover:bg-rose-50"
            >
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="m16 17 5-5-5-5" /><path d="M21 12H9" />
              </svg>
              Sign Out
            </button>
          </div>
        </div>
      }
    </div>
