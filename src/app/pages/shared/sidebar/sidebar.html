<aside class="w-58 bg-white shadow-sm flex-shrink-0 h-full fixed left-0 top-[72px] bottom-0 overflow-hidden">
  <nav class="py-2 h-full overflow-y-auto">
    <button *ngFor="let item of menuItems" (click)="activeMenu = item.id" [class.bg-blue-50]="activeMenu === item.id"
      [class.text-blue-600]="activeMenu === item.id" [class.border-l-3]="activeMenu === item.id"
      [class.border-blue-600]="activeMenu === item.id" [class.font-medium]="activeMenu === item.id"
      class="w-full px-6 py-3 flex items-center gap-3 text-gray-600 hover:bg-gray-50 transition text-sm">
      <img [src]="getIcon(item.icon)" class="w-5 h-5" alt="icon" />
      {{ item.label }}
    </button>
  </nav>
</aside>
